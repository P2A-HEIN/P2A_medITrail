<!DOCTYPE html>

<head>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>問診票送信完了 | medITrail</title>
</head>
<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<form action="/medITrail/logout" th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>

	<main>

		<p>問診票の内容はスタッフが確認します。診察までしばらくお待ちください。</p>
		<p>
			<a href="questionnaireInput.html">問診票入力画面へ戻る</a>
		</p>
	</main>
</body>
</html>
