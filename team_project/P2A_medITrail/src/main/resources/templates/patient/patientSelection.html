<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>患者選択 | medITrail</title>
</head>

<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
	</header>

	<main>
		<h1>患者選択</h1>

		<p>問診票を入力する患者を選択してください。</p>

		<table>
			<thead>
				<tr>
					<th>患者ID</th>
					<th>患者名</th>
					<th>操作</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="patient : ${patientList}">
					<td th:text="${patient.patId}"></td>
					<td th:text="${patient.patName}"></td>
					<td>
						<a th:href="@{/patient/questionnaireInput(patId=${patient.patId})}">
							この患者を選択
						</a>
					</td>
				</tr>
			</tbody>
		</table>

		<p>
			<a th:href="@{/employee/empTop}">勤務者トップへ戻る</a>
		</p>
	</main>
</body>

</html>
