<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>患者情報の削除確認 | medITrail</title>
</head>
<body>
	<!-- 表示確認用。患者情報と記録はサンプルで、保存・削除は行いません。 -->
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<ul>
				<li><a href="empTop.html">ダッシュボード</a></li>
				<li><a href="petientList.html">患者管理</a></li>
				<li><a href="operationGuide.html">操作ガイド</a></li>
			</ul>
		</nav>
		<form action="/medITrail/logout" th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>
		</form>
	</header>

	<main>
		<h1>患者情報の削除確認</h1>
		<p>次の患者情報を削除しますか。</p>
		<p>削除すると元に戻せません。患者に関連する記録も確認してください。</p>

		<dl>
			<dt>患者ID</dt>
			<dd>00000001</dd>
			<dt>氏名</dt>
			<dd>サンプル患者</dd>
			<dt>ふりがな</dt>
			<dd>さんぷるかんじゃ</dd>
			<dt>生年月日</dt>
			<dd>2000-01-01</dd>
			<dt>性別</dt>
			<dd>女性</dd>
			<dt>電話番号</dt>
			<dd>000-0000-0000</dd>
			<dt>担当医</dt>
			<dd>未設定</dd>
		</dl>

		<!-- 削除操作は行わず、完了画面の表示だけを確認します。 -->
		<p>
			<a href="patientDeleteCompletion.html">削除する</a>
			<a href="patientDetail.html">キャンセル</a>
			<a href="petientList.html">患者一覧へ戻る</a>
		</p>
	</main>
</body>
</html>
