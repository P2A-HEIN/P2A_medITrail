<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カルテ編集確認</title>
</head>
<body>

<h1>カルテ編集内容確認</h1>

<p>以下の内容に変更します。</p>

<p>カルテID：
    <span th:text="${medicalRecord.medicalRecordId}"></span>
</p>

<p>患者ID：
    <span th:text="${medicalRecord.patientId}"></span>
</p>

<p>患者名：
    <span th:text="${medicalRecord.patientName}"></span>
</p>

<p>担当勤務者：
    <span th:text="${medicalRecord.staffName}"></span>
</p>

<p>カルテ内容：
    <span th:text="${medicalRecord.recordContent}"></span>
</p>

<form th:action="@{/medicalrecord/edit}"
      th:object="${medicalRecord}" method="post">

    <input type="hidden" th:field="*{medicalRecordId}">
    <input type="hidden" th:field="*{patientId}">
    <input type="hidden" th:field="*{patientName}">
    <input type="hidden" th:field="*{staffName}">
    <input type="hidden" th:field="*{recordContent}">

    <button type="submit">更新する</button>

    <a th:href="@{/medicalrecord}">
        戻る
    </a>

</form>

</body>
</html>
