<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">

		<h1>登録内容の確認</h1>
		<p>内容をご確認のうえ、登録に進んでください。</p>

		<!-- 表示確認用のサンプルです。入力内容との連携は後で行います。 -->
		<dl>
			<dt>氏名</dt>
			<dd>サンプル患者</dd>

			<dt>ふりがな</dt>
			<dd>さんぷるかんじゃ</dd>

			<dt>生年月日</dt>

			<dt>性別</dt>
			<dd>女性</dd>

			<dt>電話番号</dt>
			<dd>—</dd>

			<dt>担当医</dt>
			<dd>未設定</dd>
		</dl>

		<!-- 表示確認用の遷移です。データベースには登録しません。 -->
		<p>
			<a href="patientRegistCompletion.html">
				この内容で登録する
			</a>
			<a href="patientRegist.html">内容を修正する</a>
		</p>
