<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>登録内容の確認 | medITrail</title>
</head>

<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<a href="empTop.html">ダッシュボード</a>
			<a href="petientList.html">患者管理</a>
		</nav>
	</header>

	<main>
		<h1>登録内容の確認</h1>
		<p>内容をご確認のうえ、登録に進んでください。</p>

		<!-- 表示確認用のサンプルです。入力内容との連携は後で行います。 -->
		<dl>
			<dt>氏名</dt>
			<dd th:text="${patientForm.patName}">サンプル患者</dd>


			<dt>生年月日</dt>
			<dd th:text="${#dates.format(patientForm.birth, 'yyyy-MM-dd')}">2000-01-01</dd>

			<dt>性別</dt>
			<dd th:text="${patientForm.gender == 1 ? '男性' : '女性'}">女性</dd>

		</dl>

		<!-- 表示確認用の遷移です。データベースには登録しません。 -->
		<form th:action="@{/employee/patientRegistCompletion}" method="post">
			<input type="hidden" name="patName" th:value="${patientForm.patName}">

			<input type="hidden" name="birth" th:value="${#dates.format(patientForm.birth, 'yyyy-MM-dd')}">
			
			<input type="hidden" name="gender" th:value="${patientForm.gender}">

			<button type="submit">この内容で登録する</button>
		</form>
		<a href="patientRegist.html">内容を修正する</a>
	</main>
</body>

</html>
