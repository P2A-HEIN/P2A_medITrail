<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>新規患者登録 | medITrail</title>
</head>

<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<a href="empTop.html">ダッシュボード</a>
			<a th:href="@{/employee/patientList}">患者管理</a>
		</nav>
	</header>

	<main>
		<h1>新規患者登録</h1>
		<p>患者情報を入力してください。</p>

		<form th:action="@{/employee/patientRegistCheck}" method="post">
			<div>
				<label for="patName">氏名（必須）</label>
				<input type="text" id="patName" name="patName" autocomplete="name" required>
			</div>

			<div>
				<label for="birth">生年月日（必須）</label>
				<input type="date" id="birth" name="birth" autocomplete="bday" required>
			</div>

			<div>
				<label for="gender">性別（必須）</label>
				<select id="gender" name="gender" required>
					<option value="">選択してください</option>
					<option value="1">男性</option>
					<option value="2">女性</option>
				</select>
			</div>

			<p>
				<button type="submit">確認する</button>
				<a th:href="@{/employee/patientList}">戻る</a>
			</p>
		</form>
	</main>
</body>

</html>
