<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カルテ削除確認</title>
</head>
<body>

<h1>カルテ削除確認</h1>

<p>次のカルテを削除します。</p>
<p>削除してよろしいですか。</p>

<p>カルテID：
    <span th:text="${medicalRecord.medicalRecordId}"></span>
</p>

<p>患者ID：
    <span th:text="${medicalRecord.patientId}"></span>
</p>

<p>患者名：
    <span th:text="${medicalRecord.patientName}"></span>
</p>

<p>担当勤務者：
    <span th:text="${medicalRecord.staffName}"></span>
</p>

<p>カルテ内容：
    <span th:text="${medicalRecord.recordContent}"></span>
</p>

<form th:action="@{/medicalrecord/delete}" method="post">

    <input type="hidden"
           name="medicalRecordId"
           th:value="${medicalRecord.medicalRecordId}">

    <button type="submit">削除する</button>

    <a th:href="@{/medicalrecord}">
        キャンセル
    </a>

</form>

</body>
</html>
