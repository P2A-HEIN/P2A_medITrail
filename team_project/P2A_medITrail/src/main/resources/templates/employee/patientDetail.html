<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>患者詳細 | medITrail</title>
</head>

<body>
	<!-- 表示確認用。患者情報と記録はサンプルで、保存・削除は行いません。 -->
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<ul>
				<li><a href="empTop.html">ダッシュボード</a></li>
				<li><a href="petientList.html">患者管理</a></li>
				<li><a href="operationGuide.html">操作ガイド</a></li>
			</ul>
		</nav>
		<form action="/medITrail/logout" th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>
		</form>
	</header>

	<main>
		<h1>患者詳細</h1>

		<section aria-labelledby="patient-title">
			<h2 id="patient-title">患者情報</h2>
			<dl>
				<dt>患者ID</dt>
				<dd th:text="${patient.patId}">00000001</dd>
				<dt>氏名</dt>
				<dd th:text="${patient.patName}">サンプル患者</dd>
				<dt>生年月日</dt>
				<dd th:text="${#dates.format(patient.birth, 'yyyy-MM-dd')}">2000-01-01</dd>
				<dt>性別</dt>
				<dd th:text="${patient.gender == 1 ? '男性' : (patient.gender == 2 ? '女性' : '未設定')}">未設定</dd>
			</dl>
			<p>
				<a href="patientEdit.html">患者情報を編集する</a>
				<a href="patientDeleteCheck.html">患者情報を削除する</a>
			</p>
		</section>


		<section aria-labelledby="questionnaire-title">
			<h2 id="questionnaire-title">問診票・AI要約</h2>

			<p th:if="${#lists.isEmpty(questionnaireList)}">
				問診票はまだ提出されていません。
			</p>

			<div th:each="questionnaire : ${questionnaireList}">
				<h3>AI要約</h3>

				<p th:text="${#dates.format(questionnaire.inputDate, 'yyyy-MM-dd HH:mm')}">
					2026-11-16 10:00
				</p>

				<p th:text="${questionnaire.aiSummary}" style="white-space: pre-wrap;">
					AI要約がここに表示されます。
				</p>

				<hr>
			</div>
		</section>


		<section aria-labelledby="records-title">
			<h2 id="records-title">カルテ一覧</h2>
			<p><a href="medicalRecordRegist.html">カルテを作成する</a></p>
			<!-- カルテの画面と処理は担当者が連携します。 -->
			<table>
				<caption>患者のカルテ記録</caption>
				<thead>
					<tr>
						<th scope="col">記録日</th>
						<th scope="col">担当勤務者</th>
						<th scope="col">内容</th>
						<th scope="col">操作</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="record : ${medicalRecordList}">
						<td th:text="${#dates.format(record.createdDate, 'yyyy-MM-dd')}">
							2026-10-30
						</td>
						<td th:text="${record.createdEmpId}">
							1
						</td>
						<td th:text="${record.diagnosisDetails}">
							診断内容
						</td>
						<td>―</td>
					</tr>

					<tr th:if="${#lists.isEmpty(medicalRecordList)}">
						<td colspan="4">カルテはまだ登録されていません。</td>
					</tr>
				</tbody>

			</table>
		</section>

		<p><a href="petientList.html">患者一覧へ戻る</a></p>
	</main>
</body>

</html>
