<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>変更内容の確認 | medITrail</title>
</head>
<body>
    <!-- 表示確認用。患者情報と記録はサンプルで、保存・削除は行いません。 -->
    <header>
        <p>電子カルテ支援システム medITrail</p>
        <nav aria-label="共通メニュー">
            <ul>
                <li><a href="empTop.html">ダッシュボード</a></li>
                <li><a href="petientList.html">患者管理</a></li>
                <li><a href="operationGuide.html">操作ガイド</a></li>
            </ul>
        </nav>
        <form action="/medITrail/logout" th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <h1>変更内容の確認</h1>
        <p>内容をご確認のうえ、よろしければ「この内容で保存する」を選んでください。</p>

        <!-- 入力画面との値の連携は後から実装します。以下は表示見本です。 -->
        <dl>
            <dt>患者ID</dt>
            <dd>00000001</dd>
            <dt>氏名</dt>
            <dd>サンプル患者</dd>
            <dt>ふりがな</dt>
            <dd>さんぷるかんじゃ</dd>
            <dt>生年月日</dt>
            <dd>2000-01-01</dd>
            <dt>性別</dt>
            <dd>女性</dd>
            <dt>電話番号</dt>
            <dd>000-0000-0000</dd>
            <dt>担当医</dt>
            <dd>未設定</dd>
        </dl>

        <!-- このリンクは完了画面の表示確認用です。情報は更新しません。 -->
        <p>
            <a href="patientEditCompletion.html">この内容で保存する</a>
            <a href="patientEdit.html">内容を修正する</a>
            <a href="patientDetail.html">キャンセル</a>
        </p>
    </main>
</body>
</html>
