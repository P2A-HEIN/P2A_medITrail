<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
          content="width=device-width, initial-scale=1.0">
	<title>患者管理 | medITrail</title>
</head>
<body>
	 <!--
	  表示確認用のHTMLです。
	  患者一覧、検索処理、遷移先は、
	Controllerとの連携時に調整します。
   -->

    <header>
		<p>電子カルテ支援システム medITrail</p>

		 <nav aria-label="共通メニュー">
 			<ul>
				<li>
                    <a href="empTop.html">ダッシュボード</a>
				 </li>
				 <li>
					 <a href="petientList.html" aria-current="page">
                        患者管理
					</a>
				 </li>
				 <li>
					 <a href="operationGuide.html">操作ガイド</a>
				 </li>
				 <li>
					  <a href="../login.html" th:href="@{/logout}"> 
						  ログアウト
					  </a>
				 </li>
			</ul>
		</nav>
	</header>

	 <main>
		 <h1>患者管理</h1>
	
		  <p>
            <a href="patientRegist.html">新規患者登録</a>
		  </p>
	
	 <section aria-labelledby="search-title">
			 <h2 id="search-title">患者検索</h2>

			 <!-- 検索処理は後から実装します。 -->
			 <form action="petientList.html" method="get">
				 <label for="keyword">
				    患者ID・患者名・担当勤務者名
				 </label>

				 <input type="search"
						 id="keyword"
					 	 name="keyword">

				<button type="submit">検索</button>
			</form>
		 </section>

		 <section aria-labelledby="patient-list-title">
			 <h2 id="patient-list-title">患者一覧</h2>

            <table>
                <caption>登録患者情報</caption>

                <thead>
                    <tr>
                        <th scope="col">患者ID</th>
                        <th scope="col">氏名</th>
                        <th scope="col">ふりがな</th>
                        <th scope="col">生年月日</th>
                        <th scope="col">性別</th>
                        <th scope="col">担当医</th>
                        <th scope="col">問診票</th>
                        <th scope="col">詳細</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- 表示確認用のサンプルデータです。 -->
                    <tr>
                        <td>00000001</td>
                        <td>サンプル患者</td>
                        <td>さんぷるかんじゃ</td>
                        <td>2000-01-01</td>
                        <td>女性</td>
                        <td>未設定</td>
                        <td>
                            <a href="questionnaireView.html">
                                閲覧
                            </a>
                        </td>
                        <td>
                            <a href="patientDetail.html">
                                詳細を開く
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <p>
            <a href="empTop.html">ダッシュボードへ戻る</a>
        </p>
    </main>
</body>
</html>
