<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カルテ編集</title>
</head>
<body>

<h1>カルテ編集</h1>

<form th:action="@{/medicalrecord/edit/check}"
      th:object="${medicalRecord}" method="post">

    <input type="hidden" th:field="*{medicalRecordId}">

    <label>患者ID</label>
    <input type="text" th:field="*{patientId}" readonly>
    <br><br>

    <label>患者名</label>
    <input type="text" th:field="*{patientName}" readonly>
    <br><br>

    <label>担当勤務者</label>
    <input type="text" th:field="*{staffName}" required>
    <br><br>

    <label>カルテ内容</label>
    <textarea th:field="*{recordContent}" required></textarea>
    <br><br>

    <button type="submit">変更内容を確認する</button>

    <a th:href="@{/medicalrecord}">戻る</a>

</form>

</body>
</html>
