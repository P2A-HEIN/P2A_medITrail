<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者情報の更新完了 | medITrail</title>
</head>
<body>
    <!-- 表示確認用。患者情報と記録はサンプルで、保存・削除は行いません。 -->
    <header>
        <p>電子カルテ支援システム medITrail</p>
        <nav aria-label="共通メニュー">
            <ul>
                <li><a href="empTop.html">ダッシュボード</a></li>
                <li><a href="petientList.html">患者管理</a></li>
                <li><a href="operationGuide.html">操作ガイド</a></li>
            </ul>
        </nav>
        <form action="/medITrail/logout" th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <!-- 更新完了時の表示見本です。実際の保存処理はまだありません。 -->
        <h1>患者情報を更新しました</h1>
        <p>サンプル患者さんの情報を更新しました。</p>
        <p>
            <a href="patientDetail.html">患者詳細へ戻る</a>
            <a href="petientList.html">患者一覧へ戻る</a>
        </p>
    </main>

</html>
