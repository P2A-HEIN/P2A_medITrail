<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>勤務者情報編集確認 | medITrail</title>
</head>

<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<a th:href="@{/admin/empList}">勤務者管理</a>
			<a href="../employee/operationGuide.html">操作ガイド</a>
		</nav>
		<form action="/medITrail/logout" th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>
		</form>
	</header>

	<main>
		<h1>変更内容の確認</h1>
		<p>内容をご確認のうえ、よろしければ保存に進んでください。</p>
		<!-- 値は表示確認用のサンプルです。入力内容との連携は後で行います。 -->
		<dl>
			<dt>勤務者名</dt>
			<dd th:text="${empName}">サンプル勤務者</dd>

			<dt>職種</dt>
			<dd th:text="${jobType}">医師</dd>
		</dl>
		<!-- 表示確認用の遷移です。ここではデータベースを更新しません。 -->
		<form th:action="@{/admin/empEditCompletion}" method="post">

			<input type="hidden" name="empId" th:value="${empId}">
			<input type="hidden" name="empName" th:value="${empName}">
			<input type="hidden" name="jobType" th:value="${jobType}">

			<p>
				<button type="submit">この内容で保存する</button>
				<a th:href="@{/admin/empEdit(empId=${empId})}">戻る</a>
			</p>
		</form>
	</main>
</body>

</html>
