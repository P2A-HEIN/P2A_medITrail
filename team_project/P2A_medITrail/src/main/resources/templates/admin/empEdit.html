<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務者情報編集 | medITrail</title>
</head>
<body>
    <header>
        <p>電子カルテ支援システム medITrail</p>
        <nav aria-label="共通メニュー">
            <a href="empList.html">勤務者管理</a>
            <a href="../employee/operationGuide.html">操作ガイド</a>
        </nav>
        <form action="/medITrail/logout" th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <h1>勤務者情報を編集</h1>
        <p>変更する内容を入力してください。</p>
        <!-- 表示確認用の見本です。対象勤務者の取得と保存は連携時に設定します。 -->
        <form action="empEditCheck.html" method="post">
            <div>
                <label for="empName">氏名（必須）</label>
                <input type="text" id="empName" name="empName"
                       value="サンプル勤務者" autocomplete="name" required>
            </div>
            <div>
                <label for="empKana">ふりがな（任意）</label>
                <input type="text" id="empKana" name="empKana"
                       value="さんぷるきんむしゃ">
            </div>
            <div>
                <label for="jobType">職種（必須）</label>
                <select id="jobType" name="jobType" required>
                    <option value="">選択してください</option>
                    <option value="医師" selected>医師</option>
                    <option value="看護師">看護師</option>
                    <option value="受付/医療事務">受付・医療事務</option>
                </select>
            </div>
            <div>
                <label for="department">所属（任意）</label>
                <input type="text" id="department" name="department"
                       value="耳鼻咽喉科">
            </div>
            <div>
                <label for="loginId">ログインID（必須）</label>
                <input type="text" id="loginId" name="loginId"
                       value="sample.staff" autocomplete="username" required>
            </div>
            <!-- 表示確認用の遷移です。入力値の受け渡しと送信時の検証は後で設定します。 -->
            <p>
                <a href="empEditCheck.html">確認する</a>
                <a href="empList.html">キャンセル</a>
            </p>
        </form>
    </main>
</body>
</html>
