<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>勤務者登録 | medITrail</title>
</head>
<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
	</header>
	
	<main>
		<h1>勤務者登録</h1>
		<p>勤務者情報を入力してください。</p>
		
		<form action="/medITrail/admin/empRegistCheck"
			th:action="@{/admin/empRegistCheck}"
			method="post">
			
			<div>
				<label for="empName">勤務者名</label>
				<input
					type="text"
					id="empName"
					name="empName"
					required>
			</div>
			
			<div>
				<label for="jobType">職種</label>
				<select id="jobType" name="jobType" required>
					<option value="">選択してください</option>
					<option value="医師">医師</option>
					<option value="看護師">看護師</option>
					<option value="受付/医療事務">受付/医療事務</option>
				</select>
			</div>
			
			<div>
				<label for="password"> パスワード</label>
				<input
					type="password"
					id="password"
					name="password"
					autocomplete="new-password"
					required>
			</div>
			
			<div>
				<a href="/medITrail/admin/empList"
					th:href="@{/admin/empList}">戻る</a>
					
				<button type="submit">確認</button>
			</div>
		</form>
	</main>
</body>
</html>
