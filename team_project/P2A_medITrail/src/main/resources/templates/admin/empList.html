<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務者一覧 | medITrail</title>
</head>
<body>
    <header>
        <p>電子カルテ支援システム medITrail</p>
        <nav aria-label="共通メニュー">
            <a href="empList.html">勤務者管理</a>
            <a href="../employee/operationGuide.html">操作ガイド</a>
        </nav>
        <form action="/medITrail/logout" th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <h1>勤務者一覧</h1>
        <p>
            <a href="empRegist.html" th:href="@{/admin/empRegist}">勤務者を登録</a>
        </p>
        <!-- HTMLで直接開いたときの見本です。実行時は既存の勤務者一覧バインドを使用します。 -->
        <table>
            <caption>勤務者情報</caption>
            <thead>
                <tr>
                    <th scope="col">勤務者ID</th>
                    <th scope="col">氏名とふりがな</th>
                    <th scope="col">職種</th>
                    <th scope="col">所属</th>
                    <th scope="col">ログインID</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employee}">
                    <td th:text="${employee.empId}">00000001</td>
                    <td>
                        <span th:text="${employee.empName}">サンプル勤務者</span>
                        <small th:remove="all">（さんぷるきんむしゃ）</small>
                    </td>
                    <td th:text="${employee.jobType}">医師</td>
                    <!-- 以下の表示値と編集・削除対象のIDはデータ連携時に設定します。 -->
                    <td>—</td>
                    <td>—</td>
                    <td>
                        <a href="empEdit.html">編集</a>
                        <a href="empDeleteCheck.html">削除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
