<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>勤務者一覧 | medITrail</title>
	</head>
	<body>
		<header>
			<p>電子カルテ支援システム medITrail</p>
			
			<nav aria-label="共通メニュー">
				<a href="../login.html"
				th:href="@{/logout}">
				ログアウト
				</a>
			</nav>
		</header>
		
		<main>
			<h1>勤務者一覧</h1>
			
			<p>
				<a href="empRegist.html"
				th:href="@{/employeeInformationRegistration}">
				勤務者登録
				</a>
			</p>
			
			<p th:remove="all">
				表示確認用のサンプルデータです
			</p>
			
			<table>
				<caption>勤務者情報</caption>
					<thead>
						<tr>
							<th scope="col">勤務者ID</th>
							<th scope="col">勤務者名</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="employee : ${employee}">
							<td th:text="${employee.empId}">00000001</td>
							<td th:text="${employee.empName}">サンプル勤務者</td>
						</tr>
					</tbody>
			</table>
		</main>
	</body>
</html>
