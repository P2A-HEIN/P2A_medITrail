<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>勤務者情報削除確認 | medITrail</title>
</head>

<body>
	<header>
		<p>電子カルテ支援システム medITrail</p>
		<nav aria-label="共通メニュー">
			<a th:href="@{/admin/empList}">勤務者管理</a>
			<a href="../employee/operationGuide.html">操作ガイド</a>
		</nav>
		<form action="/medITrail/logout" th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>
		</form>
	</header>

	<main>
		<h1>勤務者情報の削除確認</h1>
		<p>次の勤務者情報を削除します。内容を確認してください。</p>
		<dl>
			<dt>勤務者名</dt>
			<dd th:text="${employee.empName}">サンプル勤務者</dd>
			<dt>職種</dt>
			<dd th:text="${employee.jobType}">医師</dd>
			<dt>ログインID</dt>
			<dd th:text="${employee.empId}">00000001</dd>
		</dl>
		<p>削除すると元に戻せません。</p>
		<form th:action="@{/admin/empDeleteCompletion}" method="post">
			<input type="hidden" name="empId" th:value="${employee.empId}">
			<p>
				<button type="submit">削除する</button>
				<a th:href="@{/admin/empList}">戻る</a>
			</p>
		</form>
	</main>
</body>

</html>
